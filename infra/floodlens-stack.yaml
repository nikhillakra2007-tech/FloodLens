AWSTemplateFormatVersion: "2010-09-09"
Description: "FloodLens - One-Command Serverless Infrastructure: S3, IAM, CloudWatch, and Lambda Function URL"

Parameters:
  EnvironmentName:
    Type: String
    Default: "prod"
    Description: "Deployment stage (prod, staging, dev)"

  BucketName:
    Type: String
    Default: "floodlens-data-chennai"
    Description: "Name for the private S3 dataset and manifest bucket"

  ImageUri:
    Type: String
    Default: "public.ecr.aws/aws-containers/hello-app-runner:latest"
    Description: "ECR Container Image URI for the FastAPI backend"

  DatabaseURL:
    Type: String
    NoEcho: true
    Default: "postgresql+psycopg2://postgres:postgres@localhost:5432/floodlens"
    Description: "PostgreSQL + PostGIS connection string"

  FrontendCorsOrigin:
    Type: String
    Default: "*"
    Description: "Allowed CORS origins for Next.js frontend (e.g. https://main.d12345.amplifyapp.com)"

  BedrockModelId:
    Type: String
    Default: "apac.anthropic.claude-3-5-sonnet-20241022-v2:0"
    Description: "Amazon Bedrock Foundation Model ID or APAC cross-region inference profile ID"

Resources:
  # 1. S3 Dataset and Manifest Bucket
  FloodLensDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketName}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: FloodLens
        - Key: Environment
          Value: !Ref EnvironmentName

  # 2. Lambda Execution IAM Role (Least Privilege)
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "floodlens-lambda-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FloodLensS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt FloodLensDataBucket.Arn
                  - !Sub "${FloodLensDataBucket.Arn}/*"
        - PolicyName: FloodLensBedrockAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                Resource: "*"

  # 3. Lambda Function (FastAPI Backend Container)
  BackendLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "floodlens-backend-${EnvironmentName}"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 2048
      Environment:
        Variables:
          S3_BUCKET: !Ref FloodLensDataBucket
          AGENT_MODE: "bedrock"
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          DATABASE_URL: !Ref DatabaseURL
          CORS_ORIGINS: !Ref FrontendCorsOrigin
          LOG_LEVEL: "INFO"
      Tags:
        - Key: Project
          Value: FloodLens

  # 4. Lambda Public Function URL (HTTPS Endpoint)
  BackendFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt BackendLambdaFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - "*"
        MaxAge: 86400

  # 5. Public Invocation Permissions for Function URL
  BackendFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BackendLambdaFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  BackendLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BackendLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  BackendUrl:
    Description: "Public HTTPS URL of the FloodLens Backend API"
    Value: !GetAtt BackendFunctionUrl.FunctionUrl
    Export:
      Name: FloodLensBackendUrl

  S3BucketName:
    Description: "Private S3 Bucket for datasets and manifests"
    Value: !Ref FloodLensDataBucket

  LambdaFunctionArn:
    Description: "ARN of the Lambda Function"
    Value: !GetAtt BackendLambdaFunction.Arn
